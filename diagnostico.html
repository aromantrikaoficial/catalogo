<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Diagnóstico Capilar · Aromantrika</title>
  <style>
    :root {
      --bg: #F6F3EB;
      --card: #FFFFFF;
      --text: #1D2B22;
      --muted: #5A6B5E;
      --primary: #3A5A40;
      --primary-hover: #2E4833;
      --accent-soft: #E6ECE4;
      --border: #DCE2D8;
      --alert-bg: #FDF4EE;
      --alert-border: #D98A5F;
      --alert-text: #7A3E1D;
      --shadow: 0 8px 24px rgba(29, 43, 34, 0.06);
      --radius: 16px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121814;
        --card: #1B241E;
        --text: #EEF2EC;
        --muted: #9EB0A2;
        --primary: #588157;
        --primary-hover: #6A9969;
        --accent-soft: #26332A;
        --border: #2D3B31;
        --alert-bg: #2B201A;
        --alert-border: #B86B43;
        --alert-text: #F4C4A8;
        --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      line-height: 1.45;
    }

    .app {
      width: 100%;
      max-width: 460px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: var(--accent-soft);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.25s ease;
      border-radius: 99px;
    }

    .question-title {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.3;
      color: var(--text);
    }

    .question-hint {
      font-size: 0.88rem;
      color: var(--muted);
      margin-top: -12px;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      background: var(--bg);
      color: var(--text);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 0.98rem;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .option-btn:hover {
      border-color: var(--primary);
    }

    .option-btn.selected {
      background: var(--accent-soft);
      border-color: var(--primary);
      font-weight: 600;
    }

    .checkbox-icon {
      font-size: 1.15rem;
      line-height: 1.25;
      color: var(--primary);
      flex-shrink: 0;
      user-select: none;
    }

    .text-input {
      width: 100%;
      padding: 14px 16px;
      font-size: 1rem;
      font-family: inherit;
      color: var(--text);
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .text-input:focus {
      border-color: var(--primary);
    }

    .error-msg {
      color: #C0392B;
      font-size: 0.86rem;
      font-weight: 500;
      margin-top: -8px;
    }

    .nav-row {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }

    .btn {
      flex: 1;
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      border: none;
      text-align: center;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease, opacity 0.15s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: #FFFFFF;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: transparent;
      color: var(--muted);
      border: 1.5px solid var(--border);
      flex: 0 0 auto;
      padding: 14px 16px;
    }

    .btn-secondary:hover {
      border-color: var(--muted);
      color: var(--text);
    }

    .btn-full {
      width: 100%;
    }

    .result-box {
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: left;
    }

    .result-text {
      font-size: 1rem;
      color: var(--text);
    }

    .alert-box {
      background: var(--alert-bg);
      border: 1.5px solid var(--alert-border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .alert-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--alert-text);
    }

    .alert-body {
      font-size: 0.94rem;
      color: var(--text);
    }

    .note-line {
      font-size: 0.92rem;
      color: var(--muted);
      background: var(--accent-soft);
      padding: 12px 14px;
      border-radius: 10px;
    }

    .disclaimer {
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <main class="app" id="app"></main>

  <script>
    (function () {
      const WHATSAPP_NUMBER = "573002869632";

      const QUESTIONS = [
        {
          id: "nombre",
          type: "text",
          title: "¿Cómo te llamas?",
          hint: "Opcional · Si prefieres, toca Continuar.",
          placeholder: "Tu nombre"
        },
        {
          id: "color",
          type: "single",
          title: "¿Cuál es el color natural de tu cabello?",
          options: [
            { value: "claro", label: "Rubio o castaño claro, y quiero mantener mi tono" },
            { value: "otro", label: "Castaño medio u oscuro, negro u otro color" }
          ]
        },
        {
          id: "preocupaciones",
          type: "multi",
          required: true,
          title: "¿Qué te preocupa de tu cabello?",
          hint: "Puedes marcar varias opciones.",
          options: [
            { value: "caida", label: "Se me cae mucho el cabello" },
            { value: "parte", label: "Se me parte y no me crece" },
            { value: "caspa", label: "Caspa o picazón" },
            { value: "seco", label: "Está seco, opaco y sin brillo" },
            { value: "grasa", label: "Se me engrasa muy rápido" }
          ]
        },
        {
          id: "cuero",
          type: "single",
          title: "¿Cómo sientes tu cuero cabelludo un día después de lavarlo?",
          options: [
            { value: "grasa", label: "Grasoso o pesado" },
            { value: "seco", label: "Tirante o seco" },
            { value: "normal", label: "Normal" }
          ]
        },
        {
          id: "caspa",
          type: "single",
          title: "¿Tienes caspa?",
          options: [
            { value: "no", label: "No" },
            { value: "blanca", label: "Sí, pequeña y blanca, como nieve" },
            { value: "amarilla", label: "Sí, amarillenta o grasosa, pegada al cuero cabelludo" }
          ]
        },
        {
          id: "irritacion",
          type: "single",
          title: "¿Tu cuero cabelludo tiene costras, heridas, dolor, granitos o una picazón que no logras controlar?",
          options: [
            { value: "no", label: "No" },
            { value: "si", label: "Sí" }
          ]
        },
        {
          id: "como_cae",
          type: "single",
          title: "Cuando se te cae un pelo, ¿cómo es?",
          condition: (ans) => {
            const p = ans.preocupaciones || [];
            return !(p.length === 1 && p[0] === "caspa");
          },
          options: [
            { value: "punticos", label: "Largo, completo y con un puntico blanco en la raíz" },
            { value: "cortos", label: "Cortitos, partidos, sin puntico" },
            { value: "ambos", label: "Veo de los dos" },
            { value: "nose", label: "No lo he mirado" }
          ]
        },
        {
          id: "tiempo",
          type: "single",
          title: "¿Desde cuándo lo notas?",
          options: [
            { value: "menos_1m", label: "Menos de 1 mes" },
            { value: "1_3m", label: "Entre 1 y 3 meses" },
            { value: "3_6m", label: "Entre 3 y 6 meses" },
            { value: "mas_6m", label: "Más de 6 meses" }
          ]
        },
        {
          id: "eventos",
          type: "multi",
          exclusiveValue: "ninguno",
          title: "En los últimos 6 meses, ¿te pasó algo de esto?",
          hint: "Marca las que apliquen o toca Continuar.",
          options: [
            { value: "estres", label: "Estrés fuerte, duelo o un cambio grande" },
            { value: "parto", label: "Parto o lactancia" },
            { value: "enf", label: "Enfermedad con fiebre o una cirugía" },
            { value: "dieta", label: "Dieta estricta o bajé de peso rápido" },
            { value: "med", label: "Medicamentos nuevos" },
            { value: "ninguno", label: "Nada de esto" }
          ]
        },
        {
          id: "quimicos",
          type: "multi",
          exclusiveValue: "ninguno",
          title: "¿Usas calor o químicos en tu cabello?",
          hint: "Marca las que apliquen o toca Continuar.",
          options: [
            { value: "calor", label: "Plancha o secador con frecuencia" },
            { value: "tinte", label: "Tintes o decoloración" },
            { value: "alisado", label: "Alisados o keratina" },
            { value: "ninguno", label: "Ninguno" }
          ]
        },
        {
          id: "largo",
          type: "single",
          title: "¿Cómo sientes el largo y las puntas?",
          options: [
            { value: "seco", label: "Secos, sin brillo y con puntas abiertas" },
            { value: "normal", label: "Normales" }
          ]
        },
        {
          id: "familia",
          type: "single",
          title: "¿En tu familia hay entradas, coronilla clara o calvicie?",
          options: [
            { value: "si", label: "Sí" },
            { value: "no", label: "No" },
            { value: "nose", label: "No sé" }
          ]
        },
        {
          id: "senales",
          type: "multi",
          exclusiveValue: "ninguna",
          title: "¿Notas alguna de estas señales?",
          hint: "Marca las que apliquen o toca Continuar.",
          options: [
            { value: "raya", label: "La raya se ve más ancha" },
            { value: "entradas", label: "Entradas o la coronilla más clara" },
            { value: "cola", label: "La cola de caballo está más delgada" },
            { value: "calvas", label: "Zonas redondas, lisas y completamente sin pelo" },
            { value: "mechones", label: "El pelo se me cayó a mechones de golpe" },
            { value: "cuerpo", label: "Mucho cansancio, frío constante o uñas muy quebradizas" },
            { value: "ninguna", label: "Ninguna de estas" }
          ]
        },
        {
          id: "lavado",
          type: "single",
          title: "¿Cada cuánto te lavas el cabello?",
          options: [
            { value: "todos", label: "Todos los días" },
            { value: "cada2", label: "Cada 2 días" },
            { value: "3sem", label: "3 veces por semana" },
            { value: "menos3", label: "Menos de 3 veces por semana" }
          ]
        },
        {
          id: "productos",
          type: "text",
          title: "¿Qué productos usas ahora?",
          hint: "Opcional · Ej: shampoo comercial, aceite, keratina...",
          placeholder: "Escribe aquí..."
        }
      ];

      let answers = {};
      let history = [];
      let currentIndex = 0;
      let finished = false;
      let validationError = "";

      const appEl = document.getElementById("app");

      function getVisibleQuestions() {
        return QUESTIONS.filter((q) => !q.condition || q.condition(answers));
      }

      function render() {
        if (finished) {
          renderResult();
          return;
        }

        const visible = getVisibleQuestions();
        const q = visible[currentIndex];
        const progressPct = Math.round(((currentIndex + 1) / visible.length) * 100);

        let bodyHtml = "";

        if (q.type === "text") {
          const val = (answers[q.id] || "").replace(/"/g, "&quot;");
          bodyHtml = `
            <input
              type="text"
              id="textInput"
              class="text-input"
              placeholder="${q.placeholder || ""}"
              value="${val}"
              autocomplete="off"
            />
          `;
        } else if (q.type === "single") {
          const currentVal = answers[q.id];
          bodyHtml = `<div class="options">` + q.options.map((opt) => `
            <button
              type="button"
              class="option-btn ${currentVal === opt.value ? "selected" : ""}"
              data-value="${opt.value}"
            >
              <span>${opt.label}</span>
            </button>
          `).join("") + `</div>`;
        } else if (q.type === "multi") {
          const selectedArr = answers[q.id] || [];
          bodyHtml = `<div class="options">` + q.options.map((opt) => {
            const isChecked = selectedArr.includes(opt.value);
            return `
              <button
                type="button"
                class="option-btn ${isChecked ? "selected" : ""}"
                data-value="${opt.value}"
              >
                <span class="checkbox-icon">${isChecked ? "☑" : "☐"}</span>
                <span>${opt.label}</span>
              </button>
            `;
          }).join("") + `</div>`;
        }

        const showBack = history.length > 0;
        const showNext = q.type === "text" || q.type === "multi";

        appEl.innerHTML = `
          <div class="header">
            <div class="brand-row">
              <span>Aromantrika</span>
              <span>${currentIndex + 1} / ${visible.length}</span>
            </div>
            <div class="progress-track">
              <div class="progress-fill" style="width: ${progressPct}%"></div>
            </div>
          </div>

          <h1 class="question-title">${q.title}</h1>
          ${q.hint ? `<p class="question-hint">${q.hint}</p>` : ""}
          ${validationError ? `<p class="error-msg">${validationError}</p>` : ""}

          ${bodyHtml}

          ${(showBack || showNext) ? `
            <div class="nav-row">
              ${showBack ? `<button type="button" class="btn btn-secondary" id="backBtn">Volver</button>` : ""}
              ${showNext ? `<button type="button" class="btn btn-primary" id="nextBtn">Continuar</button>` : ""}
            </div>
          ` : ""}
        `;

        bindEvents(q);
      }

      function bindEvents(q) {
        const backBtn = document.getElementById("backBtn");
        if (backBtn) {
          backBtn.addEventListener("click", () => {
            validationError = "";
            if (history.length > 0) {
              currentIndex = history.pop();
              render();
            }
          });
        }

        if (q.type === "text") {
          const input = document.getElementById("textInput");
          const nextBtn = document.getElementById("nextBtn");

          const submitText = () => {
            answers[q.id] = input.value.trim();
            advance();
          };

          nextBtn.addEventListener("click", submitText);
          input.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
              e.preventDefault();
              submitText();
            }
          });
        }

        if (q.type === "single") {
          appEl.querySelectorAll(".option-btn").forEach((btn) => {
            btn.addEventListener("click", () => {
              validationError = "";
              answers[q.id] = btn.getAttribute("data-value");
              if (q.id === "preocupaciones") {
                delete answers.como_cae;
              }
              advance();
            });
          });
        }

        if (q.type === "multi") {
          appEl.querySelectorAll(".option-btn").forEach((btn) => {
            btn.addEventListener("click", () => {
              validationError = "";
              const val = btn.getAttribute("data-value");
              let current = [...(answers[q.id] || [])];

              if (q.exclusiveValue && val === q.exclusiveValue) {
                current = current.includes(val) ? [] : [val];
              } else {
                if (q.exclusiveValue) {
                  current = current.filter((item) => item !== q.exclusiveValue);
                }
                if (current.includes(val)) {
                  current = current.filter((item) => item !== val);
                } else {
                  current.push(val);
                }
              }

              answers[q.id] = current;
              if (q.id === "preocupaciones") {
                const isOnlyCaspa = current.length === 1 && current[0] === "caspa";
                if (isOnlyCaspa) delete answers.como_cae;
              }

              // Actualizar solo botones en DOM para evitar cualquier salto de scroll
              appEl.querySelectorAll(".option-btn").forEach((b) => {
                const v = b.getAttribute("data-value");
                const checked = current.includes(v);
                b.classList.toggle("selected", checked);
                const icon = b.querySelector(".checkbox-icon");
                if (icon) icon.textContent = checked ? "☑" : "☐";
              });
              const errEl = appEl.querySelector(".error-msg");
              if (errEl) errEl.remove();
            });
          });

          const nextBtn = document.getElementById("nextBtn");
          nextBtn.addEventListener("click", () => {
            let current = answers[q.id] || [];
            if (q.required && current.length === 0) {
              validationError = "Por favor elige al menos una opción.";
              render();
              return;
            }
            if (!q.required && current.length === 0 && q.exclusiveValue) {
              answers[q.id] = [q.exclusiveValue];
            }
            validationError = "";
            advance();
          });
        }
      }

      function advance() {
        const visible = getVisibleQuestions();
        if (currentIndex + 1 < visible.length) {
          history.push(currentIndex);
          currentIndex += 1;
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        } else {
          finished = true;
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      }

      function evaluateDiagnostic() {
        const nombre = (answers.nombre || "").trim();
        const preocupaciones = answers.preocupaciones || [];
        const senales = answers.senales || [];
        const eventos = answers.eventos || [];
        const quimicos = answers.quimicos || [];
        const comoCae = answers.como_cae || "";
        const cuero = answers.cuero || "normal";
        const caspa = answers.caspa || "no";
        const largo = answers.largo || "normal";

        // Alertas médicas fuertes
        const alertReasons = [];
        if (answers.irritacion === "si") {
          alertReasons.push("costras, heridas, dolor, granitos o picazón fuerte en el cuero cabelludo");
        }
        if (senales.includes("calvas")) {
          alertReasons.push("zonas redondas y lisas sin pelo");
        }
        if (senales.includes("mechones")) {
          alertReasons.push("caída a mechones de golpe");
        }

        const isStrongAlert = alertReasons.length > 0;

        // Variables de perfil
        const caida =
          preocupaciones.includes("caida") ||
          comoCae === "punticos" ||
          comoCae === "ambos";

        const tieneQuimicosOCalor =
          quimicos.length > 0 && !(quimicos.length === 1 && quimicos[0] === "ninguno");

        const rotura =
          preocupaciones.includes("parte") ||
          comoCae === "cortos" ||
          comoCae === "ambos" ||
          (largo === "seco" && tieneQuimicosOCalor);

        let perfilNum = 5;
        if (caspa === "amarilla") {
          perfilNum = 3;
        } else if (caspa === "blanca") {
          perfilNum = 2;
        } else if (caida && rotura) {
          perfilNum = 6;
        } else if (caida) {
          perfilNum = cuero === "grasa" ? 1 : 4;
        } else if (rotura || largo === "seco" || preocupaciones.includes("seco")) {
          perfilNum = 5;
        } else if (cuero === "grasa" || preocupaciones.includes("grasa")) {
          perfilNum = 1;
        } else {
          perfilNum = cuero === "seco" ? 2 : 5;
        }

        const PERFILES = {
          1: "Raíz grasa",
          2: "Cuero seco",
          3: "Caspa grasosa",
          4: "Caída por estrés",
          5: "Cabello roto",
          6: "Caída y rotura"
        };

        const nombrePerfil = PERFILES[perfilNum];
        const textoColor = answers.color === "claro" ? "cabello claro" : "cabello oscuro u otro color";

        const addCaida = caida && ![1, 4, 6].includes(perfilNum);
        const addRotura = rotura && ![5, 6].includes(perfilNum);

        let extraTag = "";
        if (addCaida && addRotura) {
          extraTag = " (también: caída y rotura)";
        } else if (addCaida) {
          extraTag = " (también: caída)";
        } else if (addRotura) {
          extraTag = " (también: rotura)";
        }

        const perfilCompleto = `${nombrePerfil} · ${textoColor}${extraTag}`;

        // Condiciones Ojo
        const ojoItems = [];
        if (answers.familia === "si") {
          ojoItems.push("antecedentes familiares");
        }
        const tieneEvento = eventos.length > 0 && !(eventos.length === 1 && eventos[0] === "ninguno");
        if (tieneEvento) {
          ojoItems.push("evento reciente");
        }
        if (answers.lavado === "todos") {
          ojoItems.push("se lava todos los días");
        }
        if (senales.includes("cuerpo")) {
          ojoItems.push("cansancio, frío o uñas");
        }

        const productosActuales = (answers.productos || "").trim() || "-";

        return {
          nombre,
          isStrongAlert,
          alertReasons,
          hasCuerpoFlag: senales.includes("cuerpo"),
          perfilCompleto,
          ojoItems,
          productosActuales,
          textoColor
        };
      }

      function buildWhatsAppUrl(diag) {
        let message = "";

        if (diag.isStrongAlert) {
          const mapPreoc = {
            caida: "caída",
            parte: "se parte",
            caspa: "caspa o picazón",
            seco: "seco/sin brillo",
            grasa: "grasa rápida"
          };
          const preocTexto = (answers.preocupaciones || [])
            .map((p) => mapPreoc[p] || p)
            .join(", ") || "-";

          const mapCuero = { grasa: "grasoso", seco: "seco", normal: "normal" };
          const mapCaspa = { no: "no", blanca: "blanca", amarilla: "amarillenta/grasosa" };

          const saludo = diag.nombre ? `Hola, soy ${diag.nombre}.` : "Hola.";
          message = [
            saludo,
            `Señales marcadas: ${diag.alertReasons.join("; ")}.`,
            `Color: ${diag.textoColor}.`,
            `Preocupaciones: ${preocTexto}.`,
            `Cuero cabelludo: ${mapCuero[answers.cuero] || "-"}. Caspa: ${mapCaspa[answers.caspa] || "-"}.`,
            `Usa ahora: ${diag.productosActuales}`,
            "",
            "Me gustaría que me orientes con el cuidado mientras tanto."
          ].join("\n");
        } else {
          const saludo = diag.nombre ? `Hola, soy ${diag.nombre}.` : "Hola.";
          const lines = [
            saludo,
            `Mi perfil: ${diag.perfilCompleto}`
          ];
          if (diag.ojoItems.length > 0) {
            lines.push(`Ojo: ${diag.ojoItems.join("; ")}`);
          }
          lines.push(`Usa ahora: ${diag.productosActuales}`);
          lines.push("");
          lines.push("Quisiera mi rutina personalizada.");
          message = lines.join("\n");
        }

        return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
      }

      function resetAll() {
        answers = {};
        history = [];
        currentIndex = 0;
        finished = false;
        validationError = "";
        render();
      }

      function renderResult() {
        const diag = evaluateDiagnostic();
        const waUrl = buildWhatsAppUrl(diag);

        if (diag.isStrongAlert) {
          const marcadasLista = diag.alertReasons.join(", ");
          appEl.innerHTML = `
            <div class="header">
              <div class="brand-row">
                <span>Aromantrika</span>
              </div>
            </div>

            <div class="result-box">
              <div class="alert-box">
                <h1 class="alert-title">Te recomendamos una valoración médica</h1>
                <p class="alert-body">
                  Por lo que nos cuentas (<strong>${marcadasLista}</strong>), lo más responsable y seguro es que un dermatólogo revise tu cuero cabelludo antes de iniciar cualquier rutina.
                </p>
                <p class="alert-body">
                  Esto no significa que no podamos acompañarte: escríbenos por WhatsApp y te orientamos con un cuidado suave mientras tanto, sin reemplazar la consulta médica.
                </p>
              </div>

              <a href="${waUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-primary btn-full">
                Escribir por WhatsApp
              </a>
              <button type="button" class="btn btn-secondary btn-full" id="restartBtn">
                Volver a empezar
              </button>
              <p class="disclaimer">
                Orientación de cuidado capilar basada en tus respuestas. No reemplaza una consulta médica.
              </p>
            </div>
          `;
        } else {
          const titleText = diag.nombre ? `¡Listo, ${diag.nombre}!` : "¡Listo!";
          appEl.innerHTML = `
            <div class="header">
              <div class="brand-row">
                <span>Aromantrika</span>
              </div>
            </div>

            <div class="result-box">
              <h1 class="question-title">${titleText}</h1>
              <p class="result-text">
                Ya tenemos tus datos. Toca el botón para enviármelos por WhatsApp y te respondo con tu rutina personalizada.
              </p>

              ${diag.hasCuerpoFlag ? `
                <p class="note-line">
                  Nota: Como marcaste cansancio, frío constante o uñas quebradizas, te sugerimos comentarlo en un chequeo médico de rutina (por ejemplo, revisar hierro y tiroides).
                </p>
              ` : ""}

              <a href="${waUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-primary btn-full">
                Enviar mis datos por WhatsApp
              </a>
              <button type="button" class="btn btn-secondary btn-full" id="restartBtn">
                Volver a empezar
              </button>
              <p class="disclaimer">
                Orientación de cuidado capilar basada en tus respuestas. No reemplaza una consulta médica.
              </p>
            </div>
          `;
        }

        document.getElementById("restartBtn").addEventListener("click", resetAll);
      }

      render();
    })();
  </script>
</body>
</html>
